spring.application.name=voluntrack-api
server.port=8080

# Hackathon default: H2 runs instantly. Switch these lines to PostgreSQL for deployment.
spring.datasource.url=jdbc:h2:mem:voluntrack;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# PostgreSQL example:
# spring.datasource.url=jdbc:postgresql://localhost:5432/voluntrack
# spring.datasource.username=postgres
# spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

app.jwt.secret=voluntrack-demo-secret-key-change-this-in-production-please
app.jwt.expiration-ms=86400000
app.cors.origin=http://localhost:5173
